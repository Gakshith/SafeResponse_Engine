<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SafeResponse Engine</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">

      <!-- ── Sidebar ───────────────────────────────────── -->
      <aside class="sidebar" aria-label="Navigation">
        <div class="sidebar-top">

          <!-- Brand -->
          <div class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span class="brand-copy">
              <strong>SafeResponse</strong>
              <span>Engine</span>
            </span>
          </div>

          <!-- New chat -->
          <button id="newChatButton" class="sidebar-action" type="button" aria-label="Start new chat">
            <span class="icon-plus" aria-hidden="true">+</span>
            <span>New chat</span>
          </button>

          <!-- Theme toggle -->
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            <span>Appearance</span>
            <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
          </button>

        </div>

        <!-- Chat list -->
        <nav class="chat-list" aria-label="Saved chats">
          <div class="sidebar-section-title">
            <p>Chats</p>
            <span id="chatCount" aria-label="Number of saved chats">0</span>
          </div>
          <div id="chatListItems" class="chat-list-items" role="list"></div>
          <p id="emptyChats" class="empty-chats">No saved chats yet</p>
        </nav>

        <div class="sidebar-footer" aria-label="Session status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Local session</span>
        </div>
      </aside>

      <!-- ── Main chat area ─────────────────────────────── -->
      <main class="chat-shell">

        <header class="chat-header">
          <div class="header-title">
            <h1>SafeResponse Engine</h1>
            <p id="chatSubtitle">Start a new verified chat</p>
          </div>
          <div class="header-controls">
            <button
              class="header-theme-btn"
              type="button"
              aria-label="Toggle theme"
              title="Toggle theme"
            >
              <span class="header-theme-icon" aria-hidden="true">☀️</span>
            </button>
          </div>
        </header>

        <section class="conversation" aria-label="Conversation">
          <div id="messages" class="messages" aria-live="polite" aria-label="Messages">

            <div id="emptyState" class="empty-state">
              <div class="empty-mark" aria-hidden="true">S</div>
              <h2>What can I help with?</h2>
              <p class="empty-hint">Ask anything — every answer is verified by the SafeResponse pipeline.</p>
            </div>

          </div>
        </section>

        <form id="chatForm" class="composer" aria-label="Chat input">
          <div class="composer-inner">
            <textarea
              id="messageInput"
              name="message"
              rows="1"
              placeholder="Message SafeResponse…"
              autocomplete="off"
              aria-label="Message input"
              required
            ></textarea>
            <button id="sendButton" type="submit" aria-label="Send message">
              <span class="send-label">Send</span>
            </button>
          </div>
        </form>

      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
